name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src tests
      - run: python scripts/scan_source.py
      - run: python -m pytest
      - run: python -m build

  windows-bundle:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[build]"
      - run: python -m PyInstaller --clean --noconfirm ai-dev-doctor.spec
      - run: python scripts/smoke_package.py dist/ai-dev-doctor/ai-dev-doctor.exe
      - name: Archive development bundle
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/ai-dev-doctor -DestinationPath dist/ai-dev-doctor-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-dev-doctor-windows-x64-development
          path: dist/ai-dev-doctor-windows-x64.zip
          retention-days: 14
          if-no-files-found: error
